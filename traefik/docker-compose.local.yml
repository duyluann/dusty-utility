services:
  traefik:
    command:
      - --log.level=INFO
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=traefik-net
      - --entrypoints.web.address=:80
  homepage:
    labels:
      - traefik.enable=true
      - traefik.http.routers.homepage-local.rule=Host(`${TRAEFIK_HOST}`)
      - traefik.http.routers.homepage-local.entrypoints=web
      - traefik.http.services.homepage.loadbalancer.server.port=80

networks:
  traefik-net:
    external: false
